<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#241334"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="LWA Hub"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><title>LWA Member Hub</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#241334;background:#f8f6fa}*{box-sizing:border-box}body{margin:0}header{background:#241334;color:white;padding:22px 18px 15px}header small{color:#e7c16b}main{max-width:800px;margin:auto;padding:16px 14px 110px}nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;display:flex;justify-content:space-around;padding:9px 0 max(12px,env(safe-area-inset-bottom));z-index:5}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:10px;padding:11px 14px;background:#563278;color:white}nav button{background:transparent;color:#3d2b4b;font-size:12px;padding:6px}nav button.active{color:#6c369c;font-weight:800}input,select,textarea{border:1px solid #cfc6d6;border-radius:9px;background:white;width:100%;padding:12px;margin:5px 0 13px}textarea{min-height:90px}.card{background:white;border:1px solid #e5dfe8;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 1px 5px #2413340a}.flex{display:flex;justify-content:space-between;align-items:center;gap:8px}.muted{color:#6b6270;font-size:13px}.pill{display:inline-block;border-radius:20px;background:#f1eaf7;color:#58327d;padding:4px 9px;font-size:12px}.alert{color:#a12335}.gold{color:#a77d25}.secondary{background:#ece5f1;color:#301a43}.danger{background:#a3273b}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metric{text-align:center;background:white;border-radius:12px;padding:12px 4px}.metric strong{font-size:24px;display:block}.hide{display:none!important}label{font-weight:600;font-size:13px}h2{margin:12px 0}h3{margin:8px 0}.rowbtn{width:100%;text-align:left;background:white;color:#241334;border:1px solid #ddd;margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.note{border-left:3px solid #d2ad5b;padding-left:12px;margin:12px 0}.tiny{font-size:12px}a{color:#6b369c} </style></head><body><header><div class="flex"><div><small>PRIVATE · LOCAL DEVICE STORAGE</small><h2 style="margin:5px 0">LWA Member Hub</h2></div><span style="font-size:27px">✦</span></div></header><main><section id="dashboard"></section><section id="members" class="hide"></section><section id="schedule" class="hide"></section><section id="settings" class="hide"></section></main><nav><button data-tab="dashboard" class="active">⌂<br>Dashboard</button><button data-tab="members">♙<br>Members</button><button data-tab="schedule">▦<br>Schedule</button><button data-tab="settings">⚙<br>Backup</button></nav><script>
'use strict';const KEY='lwa-hub-local-v1';let db={members:[],notes:[],events:[]};let tab='dashboard',editId=null,search='',memberFilter='All';const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random();const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};const stamp=()=>new Date().toISOString();function load(){try{let x=JSON.parse(localStorage.getItem(KEY));if(x&&Array.isArray(x.members)&&Array.isArray(x.notes)&&Array.isArray(x.events))db=x}catch(e){alert('Stored data could not be loaded. Restore a backup if needed.')}}function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){alert('Could not save locally. Storage may be full or disabled. Export a backup immediately.');return false}return true}function show(t){tab=t;document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('hide',x.id!==t));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();window.scrollTo(0,0)}function due(m){if(!m.next)return 'Not scheduled';if(m.next<today())return 'Overdue';if(m.next===today())return 'Due today';return 'Upcoming'}function card(m){let status=due(m);return `<button class="rowbtn" data-open="${esc(m.id)}"><div class="flex"><strong>${esc(m.name)}</strong><span class="pill ${status==='Overdue'?'alert':''}">${status}</span></div><div class="muted">${esc(m.academy||'No academy')} · ${esc(m.status||'Active')} ${m.next?'· Follow-up '+esc(m.next):''}</div></button>`}function render(){if(tab==='dashboard')dashboard();if(tab==='members')members();if(tab==='schedule')schedule();if(tab==='settings')settings()}function dashboard(){let overdue=db.members.filter(m=>due(m)==='Overdue'),now=db.members.filter(m=>due(m)==='Due today');$('dashboard').innerHTML=`<h2>Today’s overview</h2><div class="grid"><div class="metric"><strong>${db.members.length}</strong><span class="muted">Members</span></div><div class="metric"><strong class="alert">${overdue.length}</strong><span class="muted">Overdue</span></div><div class="metric"><strong>${now.length}</strong><span class="muted">Due today</span></div></div><div class="card"><h3>Needs attention</h3>${[...overdue,...now].sort((a,b)=>a.next.localeCompare(b.next)).map(card).join('')||'<p class="muted">No due follow-ups.</p>'}</div><div class="card"><h3>Upcoming appointments</h3>${db.events.filter(e=>e.date>=today()).sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).slice(0,8).map(e=>`<div class="note"><strong>${esc(e.date)} ${esc(e.time||'')}</strong><div>${esc(e.title)} · ${esc(db.members.find(m=>m.id===e.memberId)?.name||'Unassigned')}</div></div>`).join('')||'<p class="muted">No upcoming appointments.</p>'}</div><button data-new>+ Add member</button>`}function members(){if(editId==='NEW'||(editId&&db.members.some(m=>m.id===editId))){profile();return}let a=db.members.filter(m=>(m.name+' '+m.academy+' '+m.email).toLowerCase().includes(search.toLowerCase())&&(memberFilter==='All'||m.status===memberFilter)).sort((a,b)=>a.name.localeCompare(b.name));$('members').innerHTML=`<div class="flex"><h2>Member catalog</h2><button data-new>+ Add</button></div><input id="memberSearch" placeholder="Search name, academy, email" value="${esc(search)}"><select id="memberFilter">${['All','New','Active','Needs Support','Paused','Independent','Archived'].map(s=>`<option ${memberFilter===s?'selected':''}>${s}</option>`).join('')}</select><div id="memberResults">${a.map(card).join('')||'<div class="card muted">No matching members.</div>'}</div>`}function profile(){let m=editId==='NEW'?{id:'',name:'',academy:'',status:'New'}:db.members.find(x=>x.id===editId);if(!m){editId=null;members();return}let ns=db.notes.filter(n=>n.memberId===m.id).sort((a,b)=>b.created.localeCompare(a.created));$('members').innerHTML=`<div class="flex"><h2>${editId==='NEW'?'Add member':'Member profile'}</h2><button class="secondary" data-back>Back</button></div><form id="memberForm" class="card"><label>Name *</label><input name="name" required value="${esc(m.name)}"><label>Phone</label><input name="phone" type="tel" value="${esc(m.phone)}"><label>Email</label><input name="email" type="email" value="${esc(m.email)}"><label>Academy</label><select name="academy">${['','Growth Academy','Sales Academy','Business Academy','Other'].map(x=>`<option ${m.academy===x?'selected':''}>${x}</option>`).join('')}</select><label>Date joined</label><input name="joined" type="date" value="${esc(m.joined)}"><label>Member status</label><select name="status">${['New','Active','Needs Support','Paused','Independent','Archived'].map(x=>`<option ${m.status===x?'selected':''}>${x}</option>`).join('')}</select><label>Training stage</label><input name="stage" value="${esc(m.stage)}" placeholder="What are they working on?"><label>Goals / priorities</label><textarea name="goals">${esc(m.goals)}</textarea><label>Last contact</label><input name="last" type="date" value="${esc(m.last)}"><label>Next follow-up</label><input name="next" type="date" value="${esc(m.next)}"><label>Follow-up reason</label><textarea name="reason">${esc(m.reason)}</textarea><button type="submit">Save member</button></form>${editId!=='NEW'?`<div class="card"><h3>Conversation notes</h3><form id="noteForm"><label>New note</label><textarea name="body" required placeholder="What did you discuss? Next steps?"></textarea><button>Add dated note</button></form>${ns.map(n=>`<div class="note"><div class="muted">${esc(new Date(n.created).toLocaleString())}</div><p>${esc(n.body)}</p><button class="secondary tiny" data-delete-note="${esc(n.id)}">Delete note</button></div>`).join('')||'<p class="muted">No notes yet.</p>'}</div><div class="card"><h3>Schedule a conversation</h3><form id="eventForm"><label>Topic</label><input name="title" required placeholder="Coaching check-in"><label>Date</label><input name="date" type="date" required value="${today()}"><label>Time</label><input name="time" type="time"><button>Add appointment</button></form></div><button class="danger" data-delete-member>Delete member and related records</button>`:''}`}
function schedule(){let a=[...db.events].sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time));$('schedule').innerHTML=`<h2>Schedule</h2><div class="card"><p class="muted">Appointments are tracked in this app. They do not trigger iPhone alerts when the app is closed.</p>${a.map(e=>`<div class="note"><div class="flex"><div><strong>${esc(e.date)} ${esc(e.time||'')}</strong><div>${esc(e.title)}</div><div class="muted">${esc(db.members.find(m=>m.id===e.memberId)?.name||'Unassigned')}</div></div><button class="secondary" data-delete-event="${esc(e.id)}">Delete</button></div></div>`).join('')||'<p>No appointments yet. Open a member profile to add one.</p>'}</div>`}function settings(){$('settings').innerHTML=`<h2>Backups & privacy</h2><div class="card"><h3>Export your data</h3><p class="muted">Download a JSON backup containing members, notes, and appointments. Store it somewhere secure. This backup is not encrypted.</p><button id="export">Download backup</button></div><div class="card"><h3>Restore a backup</h3><p class="muted">Importing replaces all data currently in this browser. Export first if needed.</p><input type="file" id="import" accept="application/json,.json"></div><div class="card"><h3>Local-only storage</h3><p class="muted">Data is saved on this device in this app's browser storage. It does not sync to other devices. Clearing website data, removing the Home Screen app, or iOS storage cleanup may delete it. Make frequent backups.</p><p class="muted">No PIN is used. Anyone who can access this app on your unlocked phone can view its records.</p></div><div class="card"><h3>Erase local data</h3><button class="danger" id="erase">Delete all records</button></div>`}document.addEventListener('click',e=>{let b=e.target.closest('[data-tab],[data-new],[data-open],[data-back],[data-delete-member],[data-delete-note],[data-delete-event],#export,#erase');if(!b)return;if(b.dataset.tab)show(b.dataset.tab);else if(b.hasAttribute('data-new')){editId='NEW';show('members')}else if(b.dataset.open){editId=b.dataset.open;show('members')}else if(b.hasAttribute('data-back')){editId=null;show('members')}else if(b.hasAttribute('data-delete-member')){if(confirm('Delete this member, notes, and appointments permanently?')){db.members=db.members.filter(m=>m.id!==editId);db.notes=db.notes.filter(n=>n.memberId!==editId);db.events=db.events.filter(n=>n.memberId!==editId);save();editId=null;render()}}else if(b.dataset.deleteNote){if(confirm('Delete this note?')){db.notes=db.notes.filter(n=>n.id!==b.dataset.deleteNote);save();render()}}else if(b.dataset.deleteEvent){if(confirm('Delete this appointment?')){db.events=db.events.filter(n=>n.id!==b.dataset.deleteEvent);save();render()}}else if(b.id==='export'){let blob=new Blob([JSON.stringify({...db,exportedAt:stamp()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='LWA-Member-Hub-backup-'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),2000)}else if(b.id==='erase'&&confirm('Erase ALL local records? This cannot be undone without a backup.')&&confirm('Confirm permanent deletion?')){db={members:[],notes:[],events:[]};save();render()}});document.addEventListener('submit',e=>{if(!['memberForm','noteForm','eventForm'].includes(e.target.id))return;e.preventDefault();let f=e.target,vals=Object.fromEntries(new FormData(f));if(f.id==='memberForm'){let id=editId==='NEW'?uid():editId;db.members=db.members.filter(m=>m.id!==id);db.members.push({id,...vals});editId=id}else if(f.id==='noteForm')db.notes.push({id:uid(),memberId:editId,body:vals.body,created:stamp()});else if(f.id==='eventForm')db.events.push({id:uid(),memberId:editId,...vals});if(save())render()});document.addEventListener('input',e=>{if(e.target.id==='memberSearch'){search=e.target.value;let a=db.members.filter(m=>(m.name+' '+m.academy+' '+m.email).toLowerCase().includes(search.toLowerCase())&&(memberFilter==='All'||m.status===memberFilter)).sort((a,b)=>a.name.localeCompare(b.name));$('memberResults').innerHTML=a.map(card).join('')||'<div class="card muted">No matching members.</div>'}});document.addEventListener('change',async e=>{if(e.target.id==='memberFilter'){memberFilter=e.target.value;members()}if(e.target.id==='import'){let file=e.target.files[0];if(!file)return;try{let x=JSON.parse(await file.text());if(!x||!Array.isArray(x.members)||!Array.isArray(x.notes)||!Array.isArray(x.events))throw Error('Invalid backup structure');if(!confirm('Replace all current local data with this backup?'))return;db={members:x.members,notes:x.notes,events:x.events};if(save()){editId=null;show('dashboard');alert('Backup restored.')}}catch(err){alert('Unable to import: '+err.message)}}});load();show('dashboard');if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
